 # Descrizioni
 POLITICS_SALVATORE_GRASSO_DESC:0 "Salvatore Grasso è un leader carismatico che ha preso il controllo della Germania con pugno di ferro. La sua visione per il Reich è di dominio totale sull'Europa."
 POLITICS_LORENZO_CAPEZZALI_DESC:0 "Lorenzo Capezzali guida l'Italia con determinazione e ambizione. Sogna di ricreare la gloria dell'Impero Romano sotto la sua guida."
 POLITICS_PATRIZIO_VITELLI_DESC:0 "Patrizio Vitelli è proprio un negraccio scappellatore."
 POLITICS_JIAJUN_LEONARDO_CAI_DESC:0 "Jiajun Leonardo Cai il pianificatore instancabile che trasforma la logistica in potenza industriale."
 POLITICS_PIERFRANCESCO_CANTORESI_DESC:0 "Pierfrancesco Cantoresi è stato spedito sul pianeta serra in nome della resistenza, ma casualmente si è ritrovato a condurre alla gloria il regno di polonia"
 POLITICS_LORENZO_AGACHI_DESC:0 "Lorenzo Agachi è stato un vaoloroso soldato che è riusciro a scalare i piu alti gradi dell'esercito all'unico fine di rendere, la sua madre patria, romania una grande potenza globale"
 POLITICS_MATTEO_RAGNI_DESC:0 "Matteo Ragni, la feccia della feccia sovietica, salita al governo solo per puro caso. speriamo possa risollevare questo paese in rovina..."
 POLITICS_LEONARDO_MARINI_DESC:0 "Leonardo Marini, guida la nazione con un cazzo di ferro. Il suo obiettivo è la gloria della Spagna e l'affermazione del falangismo contro la zecca comunista.


